plugin: amazon.aws.aws_ec2

regions:
  - us-east-1

filters:
  instance-state-name:
    - running
  tag:Component:
    - database

hostnames:
  - instance-id

compose:
  ansible_host: instance_id
  ansible_connection: "'aws_ssm'"
  ansible_aws_ssm_region: "'us-east-1'"

groups:
  postgresql: "tags.Database == 'postgresql'"
  redis: "tags.Database == 'redis'"
  scylladb: "tags.Database == 'scylladb'"
